# Secret scanning on every commit. One-time setup:
#   brew install pre-commit gitleaks      # (or: pipx install pre-commit)
#   pre-commit install                     # installs the git hook
#   pre-commit autoupdate                  # pins the latest gitleaks release
# gitleaks reads .gitleaks.toml from the repo root automatically.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
